[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-ml-system"
version = "0.1.0"
description = "End-to-End Real-Time Fraud Detection ML System with Explainable AI"
license = "MIT"
authors = [
    {name = "Dibyendu"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "psycopg2-binary>=2.9.9; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "dashboard*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]
