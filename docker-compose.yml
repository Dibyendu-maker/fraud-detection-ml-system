services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fraud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fraud_db}
      MODELS_DIR: /app/models
      TRAINING_DATA_PATH: /app/data/raw/transactions.csv
      BUSINESS_RULES_PATH: /app/configs/business_rules.yaml
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      SYNTHETIC_TRANSACTIONS: ${SYNTHETIC_TRANSACTIONS:-20000}
      HIGH_RISK_THRESHOLD: ${HIGH_RISK_THRESHOLD:-0.75}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fraud-models:/app/models
      - fraud-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  dashboard:
    build: .
    entrypoint: ["streamlit"]
    command:
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_BASE_URL: http://api:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fraud-postgres:
  fraud-models:
  fraud-data:
